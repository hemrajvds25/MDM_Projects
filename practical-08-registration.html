<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Student Registration</title></head>
<body class="min-h-screen bg-cyan-50 flex items-center justify-center p-4 font-sans">
<main class="w-full max-w-sm bg-white rounded-xl shadow-lg p-6">
<h1 class="text-xl font-bold text-center text-teal-700 mb-4">Student Registration</h1>
<form id="f" class="space-y-4" novalidate>
<div><label for="name" class="text-xs font-semibold">Full Name</label><input id="name" class="fld w-full mt-1 border-2 border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none"><span class="err text-xs text-red-600"></span></div>
<div><label for="email" class="text-xs font-semibold">Email Address</label><input id="email" type="email" class="fld w-full mt-1 border-2 border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none"><span class="err text-xs text-red-600"></span></div>
<div><label for="pass" class="text-xs font-semibold">Password</label><input id="pass" type="password" class="fld w-full mt-1 border-2 border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none"><span class="err text-xs text-red-600"></span></div>
<div><label for="mob" class="text-xs font-semibold">Mobile Number</label><input id="mob" inputmode="numeric" class="fld w-full mt-1 border-2 border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none"><span class="err text-xs text-red-600"></span></div>
<div><label for="course" class="text-xs font-semibold">Course</label><select id="course" class="fld w-full mt-1 border-2 border-slate-300 rounded-md px-3 py-2 text-sm bg-white focus:outline-none"><option value="">Select course</option><option>CSE (Data Science)</option><option>CSE (AI &amp; ML)</option><option>Information Technology</option><option>Electronics</option></select><span class="err text-xs text-red-600"></span></div>
<div><label class="flex items-center gap-2 text-xs"><input id="terms" type="checkbox"> I agree to the terms and conditions</label><span class="err text-xs text-red-600"></span></div>
<button class="w-full py-2 rounded-md bg-teal-700 text-white text-sm hover:bg-teal-800 active:scale-95 transition focus:outline-none focus:ring-2 focus:ring-teal-300">Register</button>
<p id="ok" class="text-center text-sm font-bold text-green-700"></p></form></main>
<script>
const f=document.getElementById("f"),g=id=>document.getElementById(id);
const rules={name:v=>v.trim()?"":"Full name is required.",
 email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim())?"":"Enter a valid email address.",
 pass:v=>v.trim().length>=8?"":"Password must be at least 8 characters.",
 mob:v=>/^[6-9]\d{9}$/.test(v.trim())?"":"Enter a valid 10-digit mobile number.",
 course:v=>v?"":"Please select a course."};
function mark(el,msg){const e=el.parentElement.querySelector(".err")||el.closest("div").querySelector(".err");e.textContent=msg;
 if(el.type!=="checkbox"){el.classList.toggle("border-red-500",!!msg);el.classList.toggle("border-green-500",!msg);el.classList.remove(msg?"border-green-500":"border-red-500","border-slate-300")}}
function check(id){return rules[id]?(m=>(mark(g(id),m),!m))(rules[id](g(id).value)):true}
Object.keys(rules).forEach(id=>g(id).addEventListener("input",()=>check(id)));
f.addEventListener("submit",e=>{e.preventDefault();g("ok").textContent="";
 let ok=Object.keys(rules).map(check).every(Boolean);
 const t=g("terms").checked;mark(g("terms"),t?"":"You must accept the terms.");
 if(ok&&t){g("ok").textContent="Registration successful!";f.reset();document.querySelectorAll(".fld").forEach(x=>x.classList.remove("border-green-500"));document.querySelectorAll(".fld").forEach(x=>x.classList.add("border-slate-300"))}});
</script></body></html>
