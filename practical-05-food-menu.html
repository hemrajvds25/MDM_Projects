<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Our Popular Dishes</title></head>
<body class="min-h-screen bg-orange-50 font-sans">
<header class="text-center pt-8 pb-4"><h1 class="text-3xl font-bold text-orange-600">Our Popular Dishes</h1><p class="text-sm text-slate-500">Freshly made, served hot</p></header>
<main id="menu" class="max-w-5xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></main>
<script>
const d=[["Margherita Pizza","249","Classic pizza with fresh basil, tomato and mozzarella.","https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=600"],
["Cheese Burger","149","Juicy patty with melted cheese, lettuce and house sauce.","https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600"],
["Creamy Pasta","199","Penne in white sauce with herbs and vegetables.","https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=600"]];
menu.innerHTML=d.map(x=>`<article class="flex flex-col justify-between bg-white rounded-xl border border-slate-200 shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-300 overflow-hidden">
<img src="${x[3]}" alt="${x[0]}" loading="lazy" class="aspect-video w-full object-cover bg-orange-100">
<div class="p-4 flex flex-col flex-1 justify-between gap-3"><div><div class="flex justify-between items-center"><h2 class="font-semibold text-slate-800">${x[0]}</h2><span class="text-xs bg-orange-100 text-orange-600 rounded-full px-2 py-0.5">₹${x[1]}</span></div>
<p class="text-xs text-slate-500 mt-2">${x[2]}</p></div>
<button class="w-full py-2 rounded-lg bg-orange-500 text-white text-sm hover:bg-orange-600 active:scale-95 transition focus:outline-none focus:ring-2 focus:ring-orange-300">Order Now</button></div></article>`).join("");
</script></body></html>
