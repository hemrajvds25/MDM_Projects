<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Student Grade Calculator</title></head>
<body class="min-h-screen bg-slate-300 flex items-center justify-center p-4 font-sans">
<main class="w-full max-w-sm bg-white rounded-xl shadow-lg p-6">
<h1 class="text-xl font-bold text-center text-blue-900 mb-4">Student Grade Calculator</h1>
<form id="f" class="space-y-3" novalidate></form>
<div id="out" class="hidden mt-4 text-center text-sm rounded-lg border p-3 space-y-1"></div></main>
<script>
const subs=["Mathematics","Physics","Chemistry","English","Computer Science"];
const f=document.getElementById("f"),out=document.getElementById("out");
f.innerHTML=subs.map((s,i)=>`<div><label for="m${i}" class="block text-xs font-semibold text-slate-700">${s}</label>
<input id="m${i}" type="number" min="0" max="100" class="mark w-full mt-1 border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800"></div>`).join("")+
`<button class="w-full py-2 rounded-md bg-blue-900 text-white text-sm hover:bg-blue-800 active:scale-95 transition focus:outline-none focus:ring-2 focus:ring-blue-400">Calculate</button>`;
f.addEventListener("submit",e=>{e.preventDefault();
 const v=[...document.querySelectorAll(".mark")].map(i=>parseFloat(i.value));
 out.classList.remove("hidden","border-green-500","bg-green-50","text-green-700","border-red-500","bg-red-50","text-red-700");
 if(v.some(n=>isNaN(n)||n<0||n>100)){out.classList.add("border-red-500","bg-red-50","text-red-700");out.textContent="Enter valid marks between 0 and 100 for every subject.";return}
 const t=v.reduce((a,b)=>a+b,0),p=t/(v.length*100)*100;
 const g=p>=90?"O":p>=80?"A":p>=70?"B":p>=60?"C":p>=50?"D":p>=40?"E":"F";
 const pass=g!=="F"&&v.every(n=>n>=35),c=pass?["border-green-500","bg-green-50","text-green-700"]:["border-red-500","bg-red-50","text-red-700"];
 out.classList.add(...c);
 out.innerHTML=`<p>Total: <b>${t} / ${v.length*100}</b></p><p>Percentage: <b>${p.toFixed(2)}%</b></p><p>Grade: <b>${g}</b></p><p>Status: <b>${pass?"PASS":"FAIL"}</b></p>`;
});
</script></body></html>
