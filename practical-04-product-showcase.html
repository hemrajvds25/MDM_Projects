<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>New Collection 2026</title></head>
<body class="min-h-screen bg-indigo-50 font-sans">
<header class="bg-indigo-700 text-white px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1">
<h1 class="text-xl sm:text-2xl font-bold">New Collection 2026</h1><p class="text-xs sm:text-sm text-indigo-200">Resize the window to see the layout change</p></header>
<main class="max-w-6xl mx-auto p-4 sm:p-8 flex flex-col md:flex-row md:flex-wrap gap-5 justify-center">
<script>
const items=[["🎧","Wireless Headphones","Noise cancelling, 30-hour battery","2,999","bg-sky-200"],["⌚","Smart Watch","Heart-rate and sleep tracking","3,499","bg-pink-200"],["🎒","Laptop Backpack","Water-resistant with USB port","1,299","bg-emerald-200"],["🖱️","Gaming Mouse","Ergonomic with RGB lighting","899","bg-amber-200"]];
document.currentScript.insertAdjacentHTML("afterend",items.map(i=>`<article class="flex flex-col w-full sm:w-72 md:w-[calc(50%-0.625rem)] lg:w-[calc(25%-1rem)] bg-white rounded-xl shadow-md overflow-hidden">
<div class="${i[4]} h-36 flex items-center justify-center text-6xl">${i[0]}</div>
<div class="p-4 flex flex-col flex-1 justify-between gap-3"><div><h2 class="font-semibold text-slate-800">${i[1]}</h2><p class="text-xs text-slate-500 mt-1">${i[2]}</p></div>
<div class="flex items-center justify-between"><span class="font-bold text-indigo-700">₹${i[3]}</span>
<button class="px-4 py-1.5 rounded-lg bg-indigo-600 text-white text-sm hover:bg-indigo-700 active:scale-95 transition focus:outline-none focus:ring-2 focus:ring-indigo-300">Buy Now</button></div></div></article>`).join(""));
</script></main></body></html>
